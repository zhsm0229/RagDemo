# 生产栈 compose（standards §12.2/§12.5 口径）：仅 app 对外发布 80，其余纯内网互联。
# 用法（部署机）：统一经 ./deploy.sh <digest>（按内存分档错峰起栈，≥22G 才含 mineru 常驻）；
# 手工兜底按 deploy-requirements §4.4 逐服务 up + 等健康，严禁一次性全量 up。
# 密钥经同目录 .env.prod（git 忽略，逐字段清单见 runbook §9），本文件零明文密钥（§12.7）。
# 镜像一律 digest 引用（§13.2 同 digest 双 tag），digest 清单见 deploy/releases.md。
services:
  app:
    image: ${APP_IMAGE:?必须提供镜像 digest 引用，如 ghcr.io/org/repo/ragdemo@sha256:...}
    container_name: ragdemo-app
    ports:
      - "80:8000" # 全栈唯一对外端口（前端 dist + /api 同源）
    environment:
      DATABASE_URL: postgresql+psycopg://rag:${POSTGRES_PASSWORD:?}@pg:5432/rag
      STATIC_DIR: /srv/ragdemo/static
      # 老格式转换服务（F-1015）：内网互联走服务名，覆盖 .env.prod 的宿主端口值
      # （与 TEI/MinerU 容器内互联同模式）
      CONVERT_BASE_URL: http://gotenberg:3000
    env_file:
      - .env.prod
    volumes:
      # uploads named volume：.env.prod 的 STORAGE_DIR 必须落在挂载点 /srv/ragdemo/data 之下（runbook §9.2）；
      # 备份/恢复走卷口径（runbook §3.6，宿主路径备份对卷无效）
      - uploads:/srv/ragdemo/data
    depends_on:
      pg:
        condition: service_healthy
    mem_limit: 2g # §12.5 app 2C2G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  pg:
    image: pgvector/pgvector@sha256:47af0b65960b14f1c6945aa4ccae37836c632e9a6fe0eea9160936e616e5b2e9 # pg15（§12.2 钉 15+）；digest 2026-10-31 由 tag pg15 钉取（工单 14）
    container_name: ragdemo-pg
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 3g # §12.5 pg 2C3G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  tei-embed:
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:16230cd8f679ae5f8a51d585033628b1c0d45cd70c2bc9b0d208170d71218fdb # cpu-1.9.2（工单 14 digest 钉版）
    container_name: ragdemo-tei-embed
    command: ["--model-id", "/data/bge-m3", "--pooling", "cls", "--max-batch-tokens", "2048"]
    volumes:
      - ${TEI_MODELS_DIR:-/opt/ragdemo/tei-models}:/data:ro
    mem_limit: 3g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 10m

  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:16230cd8f679ae5f8a51d585033628b1c0d45cd70c2bc9b0d208170d71218fdb # cpu-1.9.2（工单 14 digest 钉版）
    container_name: ragdemo-tei-rerank
    command: ["--model-id", "/data/bge-reranker-v2-m3", "--max-batch-tokens", "2048"]
    volumes:
      - ${TEI_MODELS_DIR:-/opt/ragdemo/tei-models}:/data:ro
    # 偏差登记：§12.5 按 GPU 口径给 1C3G；现 CPU candle 后端加载+预热峰值需 4.5g
    #（reranker 仓库无 onnx 导出，dev compose 同为 4.5g）。GPU TEI 到位后调回并复测（runbook 模型版本表跟踪）。
    mem_limit: 4.5g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 10m

  mineru:
    image: ${MINERU_IMAGE:-mineru-cpu:2.5.4} # 部署机自建（docker/mineru-cpu.Dockerfile），digest 入 runbook 模型版本表
    # 随栈与否由 deploy.sh 按内存分档决定（≥22G 常驻；<22G 发布不含本服务，解析前按需 up -d mineru，
    # 用后 docker stop 释放内存——restart=unless-stopped 手动停后不自启，runbook §9 / deploy-requirements §4.3）
    container_name: ragdemo-mineru
    environment:
      MINERU_MODEL_SOURCE: modelscope
    volumes:
      - mineru-models:/root/.cache
    mem_limit: 6g # §12.5 mineru 4C6G（ONNX/pipeline 后端）
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 15m

  gotenberg:
    image: gotenberg/gotenberg@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5 # 老格式转换（F-1015），仅内网；工单 14 digest 钉版（原浮动 :8 会大版本内 silent 升级）
    container_name: ragdemo-gotenberg
    command: ["gotenberg", "--api-timeout=120s"]
    mem_limit: 1g # 转换并发=1，LibreOffice 单实例峰值 ~500MB
    restart: unless-stopped
    healthcheck:
      # Gotenberg 8 实际监听 3000（与 CONVERT_BASE_URL 同源）；探 3000 端口（与 CONVERT_BASE_URL 同源）
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  uploads:
  mineru-models:
