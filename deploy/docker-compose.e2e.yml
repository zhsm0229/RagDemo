# E2E 专用覆盖（叠加主 compose）：TEST_MODE 硬编码 true——L1 确定性层的
# 唯一事实源，杜绝 shell 环境传递丢变量导致的"真模式跑测试"事故。
# 用法（三文件叠加，第三层把 app 指向隔离库 pg-e2e/rag_e2e，E2E_WIPE 不触碰试点库）：
#   docker compose -f docker-compose.yml -f deploy/docker-compose.e2e.yml \
#     -f deploy/docker-compose.e2e-isolated.yml up -d --build pg-e2e app
#   （frontend/ 内等价入口：npm run e2e:up / npm run e2e:down）
services:
  app:
    environment:
      TEST_MODE: "true"
      # CI runner 无 TEI/MinerU：stub 全链（装配层 test_mode 分支）；
      # 本机有 TEI 时此覆盖同样生效（test_mode 优先走 Stub，L2 真实层另行直连部署机）
      EMBED_BASE_URL: http://tei-embed:80
      RERANK_BASE_URL: http://tei-rerank:80
      # 图片 OCR（F-1017）依赖真实 MinerU：L1 确定性层显式关闭，
      # 防宿主 .env 的 IMAGE_OCR_ENABLED=true 泄入使含图用例超时（2026-10-06 DOC-25 教训）
      IMAGE_OCR_ENABLED: "false"
