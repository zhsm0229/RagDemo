# 无 MinerU 降级交付覆盖（工单 10，许可合规）：叠加主 compose（dev）或 prod compose 使用。
# 许可动机：MinerU 为 AGPL-3.0（docker/mineru-cpu.Dockerfile 钉 mineru[core]==2.5.4），
# 客户不接受 AGPL 组件随栈交付时按本档交付——不构建/不分发 mineru 镜像，pdf 一律 pypdf。
# 用法（二选一，在仓库根执行）：
#   dev： docker compose -f docker-compose.yml -f deploy/docker-compose.nomineru.yml up -d
#   prod：docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.nomineru.yml up -d
#   （仍走 deploy.sh 发布时：以 <22G 低配档语义运行本覆盖栈，且跳过 runbook §6 的
#    mineru 镜像自建步骤与"解析前按需 up -d mineru"操作——本档不提供该镜像。）
# 语义（compose 覆盖合并规则）：
#   1) mineru 划入 full profile——缺省 up 不含该服务（--profile full 可显式拉起，降级档不使用）；
#   2) app.environment 的 MINERU_BASE_URL 置空，优先级高于 env_file(.env/.env.prod) 同名项——
#      get_parser（app/rag/parser.py）对空 mineru_base_url 直选 PdfFallbackParser（pypdf），
#      扫描件解析将按质量红线给 422"疑似扫描件或空文档"（如实拒收，不静默造文本）。
# 验收与功能差异清单：docs/deploy-requirements.md §8「无 MinerU 交付形态」；
# 组件许可与 AGPL 义务边界分析：.scratch/commercial-readiness/design/10-license-compliance-tech.md。
services:
  mineru:
    profiles: ["full"]
  app:
    environment:
      MINERU_BASE_URL: ""
