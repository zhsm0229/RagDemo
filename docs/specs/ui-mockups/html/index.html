<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业智能工作台 · 交互式界面原型（评审用）</title>
<link rel="stylesheet" href="lib/element-plus.css">
<style>
  html,body,#app{height:100%;margin:0}
  body{font-family:"Helvetica Neue",Helvetica,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;background:#f5f7fa}
  /* 只读置灰（standards §8.8）：需复制的只读值用 readonly，保留选中复制 */
  .readonly-grey .el-input__inner,.el-input__inner[readonly]{color:#a8abb2!important;background:#f5f7fa!important;cursor:text}
  .layout{display:flex;height:100%}
  .sidebar{width:220px;background:#fff;border-right:1px solid #e4e7ed;display:flex;flex-direction:column}
  .logo{height:56px;display:flex;align-items:center;padding:0 16px;font-weight:600;font-size:16px;color:#409eff;border-bottom:1px solid #f0f0f0}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:56px;background:#fff;border-bottom:1px solid #e4e7ed;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
  .content{flex:1;overflow:auto;padding:16px 20px}
  .filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .pager-row{display:flex;justify-content:flex-end;margin-top:12px}
  /* 问答页 */
  .chat-wrap{display:flex;gap:12px;height:100%}
  .conv-list{width:230px;background:#fff;border:1px solid #e4e7ed;border-radius:6px;display:flex;flex-direction:column}
  .conv-list .new-btn{margin:10px}
  .conv-items{flex:1;overflow:auto}
  .conv-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid #f5f7fa;display:flex;justify-content:space-between;align-items:center}
  .conv-item:hover{background:#f5f7fa}
  .conv-item.active{background:#ecf5ff;color:#409eff}
  .conv-item .del{visibility:hidden;color:#c0c4cc}
  .conv-item:hover .del{visibility:visible}
  .chat-main{flex:1;display:flex;flex-direction:column;background:#fff;border:1px solid #e4e7ed;border-radius:6px;min-width:0;position:relative}
  .msgs{flex:1;overflow:auto;padding:16px 20px}
  .bubble{max-width:78%;margin-bottom:14px;padding:10px 14px;border-radius:8px;line-height:1.7;font-size:14px;white-space:pre-wrap;word-break:break-word}
  .bubble.user{background:#409eff;color:#fff;margin-left:auto}
  .bubble.assistant{background:#f4f4f5;color:#303133}
  .bubble .cite{display:inline-block;min-width:18px;text-align:center;background:#d9ecff;color:#409eff;border-radius:4px;font-size:12px;margin:0 2px;cursor:pointer;padding:0 3px}
  .bubble .cite.hl{background:#409eff;color:#fff}
  .msg-meta{font-size:12px;color:#909399;margin-top:6px;display:flex;gap:10px;align-items:center}
  .cite-panel{width:300px;background:#fff;border:1px solid #e4e7ed;border-radius:6px;display:flex;flex-direction:column}
  .cite-panel .head{padding:10px 14px;border-bottom:1px solid #f0f0f0;font-weight:600}
  .cite-panel .list{flex:1;overflow:auto;padding:10px}
  .cite-card{border:1px solid #e4e7ed;border-radius:6px;padding:10px;margin-bottom:8px;font-size:13px;cursor:pointer;transition:all .2s}
  .cite-card:hover{border-color:#409eff}
  .cite-card.hl{border-color:#409eff;background:#ecf5ff}
  .cite-card .score{color:#909399;font-size:12px}
  .chat-input{border-top:1px solid #e4e7ed;padding:12px 16px;display:flex;gap:10px;align-items:flex-end}
  /* 概览 */
  .stat-cards{display:flex;gap:12px;margin-bottom:16px}
  .stat-card{flex:1;background:#fff;border:1px solid #e4e7ed;border-radius:6px;padding:16px}
  .stat-card .num{font-size:28px;font-weight:600;color:#303133}
  .stat-card .lbl{font-size:13px;color:#909399;margin-top:4px}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px}
  .bar-name{width:120px;color:#606266}
  .bar-track{flex:1;background:#f0f2f5;border-radius:4px;height:14px;overflow:hidden}
  .bar-fill{height:100%;background:#409eff;border-radius:4px}
  .panel{background:#fff;border:1px solid #e4e7ed;border-radius:6px;padding:16px;margin-bottom:16px}
  .panel h4{margin:0 0 12px;font-size:14px;color:#303133}
  .login-box{width:380px;margin:10vh auto;background:#fff;border:1px solid #e4e7ed;border-radius:8px;padding:32px}
  .login-box h2{text-align:center;margin:0 0 8px;color:#303133}
  .login-sub{text-align:center;color:#909399;font-size:13px;margin-bottom:20px}
  .demo-tip{margin-top:16px;font-size:12px;color:#909399;background:#f4f4f5;border-radius:4px;padding:8px 12px;line-height:1.8}
  .err-inline{color:#f56c6c;font-size:12px;margin-top:4px}
</style>

function addAudit(action, obj, detail) {

}
function nowStr() {
  const d = new Date(); const p = n => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;

  },
  template: `
  <div>

        <el-form-item label="新密码"><el-input v-model="changePwd.p1" type="password" show-password placeholder="至少 8 位"></el-input></el-form-item>
        <el-form-item label="确认密码"><el-input v-model="changePwd.p2" type="password" show-password></el-input></el-form-item>

      const u = S.users.find(x => x.username === this.form.username.trim());

    doChangePwd() {
      if (this.changePwd.p1.length < 8) { this.changePwd.err = '密码至少 8 位'; return; }
      if (this.changePwd.p1 !== this.changePwd.p2) { this.changePwd.err = '两次输入不一致'; return; }

      this.changePwd.show = false;
      this.$emit('logged', u);
    },
  },

/* ---------- P2 智能问答 ---------- */
const ChatView = {
  data() {
    return {
      S, activeConvId: S.conversations[0]?.id || null,
      input: '', streaming: false,
      citeHl: 0,
      citeCollapsed: false,
      fbDialog: { show: false, msg: null, cat: '', comment: '', err: '' },
      srcDialog: { show: false, cite: null },
      cats: ['答案错误', '引用无关', '拒答不当', '其他'],
    };
  },
  computed: {
    activeConv() { return S.conversations.find(c => c.id === this.activeConvId); },
    lastAssistant() {
      if (!this.activeConv) return null;
      const a = [...this.activeConv.msgs].reverse().find(m => m.role === 'assistant');
      return a || null;
    },
    inputLen() { return this.input.trim().length; },
    inputErr() { if (this.inputLen === 0) return ''; if (this.inputLen > 2000) return '问题长度不能超过 2000 字'; return ''; },
  },
  methods: {
    onEnter(e) {
      // 中文输入法选词回车不发送（isComposing 守卫）
      if (e.isComposing || e.keyCode === 229) return;
      this.send();
    },
    newConv() {
      const c = { id: nextId(), title: '新会话', dept: S.loggedUser.dept, time: nowStr(), msgs: [] };
      S.conversations.unshift(c); this.activeConvId = c.id;
    },
    delConv(c) {
      const i = S.conversations.indexOf(c); S.conversations.splice(i, 1);
      if (this.activeConvId === c.id) this.activeConvId = S.conversations[0]?.id || null;
      ElementPlus.ElMessage.success('会话已删除');
    },
    visibleSegs(m) {
      if (m.role === 'user' || m.refused || !m.segs) return m.refused ? [{ t: 'text', s: m.text }] : [{ t: 'text', s: m.text }];
      if (m.shown === undefined || m.shown >= m.total) return m.segs;
      const out = []; let left = m.shown;
      for (const seg of m.segs) {
        if (seg.t === 'cite') { out.push(seg); continue; }
        if (left <= 0) break;
        if (seg.s.length <= left) { out.push(seg); left -= seg.s.length; }
        else { out.push({ t: 'text', s: seg.s.slice(0, left) }); left = 0; }
      }
      return out;
    },
    send() {
      if (this.inputErr || this.streaming) return;
      const q = this.input.trim(); if (!q) return;
      if (!this.activeConv) this.newConv();
      const conv = this.activeConv;
      conv.msgs.push({ id: nextId(), role: 'user', text: q, time: nowStr() });
      if (conv.title === '新会话') conv.title = q.slice(0, 12);
      this.input = '';
      conv.time = nowStr();
      const ci = S.conversations.indexOf(conv);
      if (ci > 0) { S.conversations.splice(ci, 1); S.conversations.unshift(conv); }
      const cacheKey = S.loggedUser.dept + '|' + q;
      this.streaming = true;
      const hit = this._cache && this._cache[cacheKey];
      const finish = (answer) => {
        const m = { id: nextId(), role: 'assistant', time: nowStr(), feedback: null,
          cacheHit: !!hit, refused: !answer,
          segs: answer ? answer.segs : undefined,
          text: answer ? undefined : '知识库中未找到相关内容。建议换个问法，或联系管理员补充知识库。',
          citations: answer ? answer.cites : [], tokens: answer ? ('in ' + (800 + q.length * 2) + ' / out ' + (120 + q.length)) : '-',
          durationMs: answer ? 900 + q.length * 15 : 600 };
        if (hit) { m.segs = hit.segs; m.citations = hit.citations; m.tokens = hit.tokens; }
        conv.msgs.push(m);
        if (!hit && answer) this._cache = { ...(this._cache || {}), [cacheKey]: { segs: m.segs, citations: m.citations, tokens: m.tokens } };
        if (!hit) this.typeOut(m);
        else { this.streaming = false; ElementPlus.ElMessage({ message: '命中缓存，本次未调用模型', type: 'info' }); }
        this.scrollBottom();
      };
      setTimeout(() => {
        // 演示断流：问题含"断流"时模拟生成中断（error 事件分支，CHAT-12）
        if (q.includes('断流')) {
          const m = { id: nextId(), role: 'assistant', time: nowStr(), feedback: null,
            segs: [{ t: 'text', s: '根据资料[1]，……' }], shown: 12, total: 12,
            citations: [], tokens: 'in 912 / out 36', durationMs: 2400,
            failed: true, refused: false, cacheHit: false };
          conv.msgs.push(m);
          this.streaming = false;
          this.scrollBottom();
          ElementPlus.ElMessage({ message: '生成中断，请点击"重试"重新生成', type: 'error' });
          return;
        }
        const item = mockAnswer(q);
        if (!item) { finish(null); return; }
        const segs = [];
        for (const part of item.answer.split(/\{(\d+)\}/).filter(x => x !== '')) {
          if (/^\d+$/.test(part)) segs.push({ t: 'cite', n: Number(part) });
          else segs.push({ t: 'text', s: part });
        }
        finish({ segs, cites: item.cites });
      }, 600);
    },
    typeOut(m) {
      if (!m.segs) { this.streaming = false; return; }  // 拒答路径无 segments，直接结束
      m.total = m.segs.reduce((n, s) => n + (s.t === 'text' ? s.s.length : 1), 0);
      m.shown = 0;
      const timer = setInterval(() => {
        m.shown += 3;
        this.scrollBottom();
        if (m.shown >= m.total) { m.shown = m.total; clearInterval(timer); this.streaming = false; }
      }, 24);
    },
    scrollBottom() {
      nextTick(() => { const el = this.$refs.msgs; if (el) el.scrollTop = el.scrollHeight; });
    },
    retryMsg(m) {
      // 中断重试：移除失败消息，用原问题重新生成（重试=新消息，不重复落库用户消息）
      const conv = this.activeConv;
      const i = conv.msgs.indexOf(m);
      if (i >= 0) conv.msgs.splice(i, 1);
      const lastUser = [...conv.msgs].reverse().find(x => x.role === 'user');
      if (lastUser) { this.input = lastUser.text; this.send(); }
    },
    hlCite(n) { this.citeHl = n; nextTick(() => { const el = document.getElementById('cite-' + n); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }); },
    showSrc(cite) { this.srcDialog.cite = cite; this.srcDialog.show = true; },
    openFb(m) { this.fbDialog = { show: true, msg: m, cat: '', comment: '', err: '' }; },
    submitFb() {
      if (!this.fbDialog.cat) { this.fbDialog.err = '请选择问题分类'; return; }
      if (!this.fbDialog.comment.trim()) { this.fbDialog.err = '点踩必须填写备注（帮助定位 badcase）'; return; }
      const m = this.fbDialog.msg;
      m.feedback = 'down'; m.feedbackCategory = this.fbDialog.cat; m.feedbackComment = this.fbDialog.comment;
      S.badcases.unshift({ id: nextId(), time: nowStr(), dept: S.loggedUser.dept, q: this.activeConv.msgs.filter(x => x.role === 'user').slice(-1)[0].text,
        cat: this.fbDialog.cat, comment: this.fbDialog.comment, status: '待处理' });
      addAudit('message.feedback', '会话 #' + this.activeConv.id, '点踩：' + this.fbDialog.cat);
      this.fbDialog.show = false;
      ElementPlus.ElMessage.success('反馈已提交，感谢帮助改进');
    },
    like(m) { m.feedback = 'up'; ElementPlus.ElMessage.success('已点赞'); },
  },
  template: `
  <div class="chat-wrap">
    <div class="conv-list">
      <el-button type="primary" class="new-btn" style="width:calc(100% - 20px)" @click="newConv">＋ 新会话</el-button>
      <div class="conv-items">
        <el-empty v-if="!S.conversations.length" description="还没有会话" :image-size="60">
          <el-button type="primary" size="small" @click="newConv">发起第一场问答</el-button>
        </el-empty>
        <div v-for="c in S.conversations" :key="c.id" class="conv-item" :class="{active: c.id === activeConvId}" @click="activeConvId = c.id">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ c.title }}<div style="font-size:12px;color:#c0c4cc">{{ c.time }}</div></span>
          <el-popconfirm title="确认删除该会话？" confirm-button-text="删除" cancel-button-text="取消" @confirm="delConv(c)">
            <template #reference><el-button class="del" link size="small">删除</el-button></template>
          </el-popconfirm>
        </div>
      </div>
    </div>
    <div class="chat-main">
      <el-button v-if="citeCollapsed" link type="primary" size="small" style="position:absolute;top:10px;right:12px;z-index:5" @click="citeCollapsed = false">引用面板</el-button>
      <div class="msgs" ref="msgs">
        <el-empty v-if="!activeConv || !activeConv.msgs.length" description="问点什么吧，例如：差旅报销标准是多少？"></el-empty>
        <template v-for="m in activeConv?.msgs || []" :key="m.id">
          <div v-if="m.role === 'user'" class="bubble user">{{ m.text }}</div>
          <div v-else class="bubble assistant">
            <template v-for="(seg, i) in visibleSegs(m)" :key="i">
              <span v-if="seg.t === 'text'">{{ seg.s }}</span>
              <sup v-else class="cite" :class="{hl: citeHl === seg.n}" @click="hlCite(seg.n)">{{ seg.n }}</sup>
            </template>
            <div class="msg-meta" v-if="m.shown === undefined || m.shown >= (m.total || 0)">
              <template v-if="m.failed">
                <el-tag type="danger" size="small">生成中断</el-tag>
                <el-button link type="primary" size="small" @click="retryMsg(m)">重试</el-button>
              </template>
              <span v-if="m.refused">⚠️ 已拒答：知识库中暂无相关内容</span>
              <el-tag v-if="m.cacheHit" size="small" type="info">来自缓存</el-tag>
              <span v-if="m.tokens && m.tokens !== '-'">token: {{ m.tokens }} · {{ m.durationMs || '-' }}ms</span>
              <span style="flex:1"></span>
              <template v-if="!m.refused">
                <el-button link size="small" :type="m.feedback === 'up' ? 'primary' : ''" @click="like(m)">👍</el-button>
                <el-button link size="small" :type="m.feedback === 'down' ? 'danger' : ''" @click="openFb(m)">👎</el-button>
              </template>
              <span v-if="m.feedback === 'down'" style="color:#f56c6c">已点踩：{{ m.feedbackCategory }}</span>
            </div>
          </div>
        </template>
      </div>
      <div class="chat-input">
        <el-input v-model="input" type="textarea" :rows="2" resize="none" maxlength="2100"
          placeholder="输入问题（1-2000 字），Enter 发送 / Shift+Enter 换行" @keydown.enter.exact.prevent="onEnter"></el-input>
        <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
          <el-tooltip :content="streaming ? '回答生成中，请稍候' : (inputErr || (inputLen === 0 ? '请输入问题' : '发送'))" :disabled="streaming" placement="top">
            <span><el-button type="primary" :disabled="streaming || inputErr !== ''" @click="send">发送</el-button></span>
          </el-tooltip>
          <span style="font-size:12px" :class="inputErr ? 'err-inline' : ''">{{ inputLen }}/2000{{ inputErr ? ' ' + inputErr : '' }}</span>
        </div>
      </div>
    </div>
      <div class="cite-panel" v-if="!citeCollapsed">
      <div class="head" style="display:flex;align-items:center">引用来源<span style="flex:1"></span><el-button link size="small" @click="citeCollapsed = true">收起</el-button></div>
      <div class="list">
        <el-empty v-if="!lastAssistant || !lastAssistant.citations || !lastAssistant.citations.length" description="无引用（拒答回答不带引用）" :image-size="60"></el-empty>
        <div v-for="c in lastAssistant?.citations || []" :key="c.n" class="cite-card" :id="'cite-' + c.n" :class="{hl: citeHl === c.n}" @click="showSrc(c)">
          <div><b>[{{ c.n }}] {{ c.title }}</b> <el-tag size="small" :type="c.type === 'qa' ? 'warning' : 'primary'">{{ c.type === 'qa' ? '问答对' : '文档块' }}</el-tag></div>
          <div class="score">{{ c.path }} · 相似度 {{ c.score }}</div>
        </div>
      </div>
    </div>

    <el-dialog v-model="fbDialog.show" title="反馈问题（点踩）" :close-on-click-modal="false" width="440px">
      <el-form label-width="80px">
        <el-form-item label="分类" required>
          <el-radio-group v-model="fbDialog.cat">
            <el-radio v-for="c in cats" :key="c" :value="c">{{ c }}</el-radio>
          </el-radio-group>
        </el-form-item>
        <el-form-item label="备注" required>
          <el-input v-model="fbDialog.comment" type="textarea" :rows="3" placeholder="请描述问题，帮助定位 badcase"></el-input>
        </el-form-item>
        <div class="err-inline" v-if="fbDialog.err">{{ fbDialog.err }}</div>
      </el-form>
      <template #footer>
        <el-button @click="fbDialog.show = false">取消</el-button>
        <el-button type="primary" @click="submitFb">提交反馈</el-button>
      </template>
    </el-dialog>

    <el-dialog v-model="srcDialog.show" title="引用原文核对" :close-on-click-modal="false" width="560px">
      <template v-if="srcDialog.cite">
        <p style="margin:0 0 8px"><b>[{{ srcDialog.cite.n }}] {{ srcDialog.cite.title }}</b></p>
        <p style="margin:0 0 8px;color:#909399;font-size:13px">页码/来源：{{ srcDialog.cite.page }} ｜ 位置：{{ srcDialog.cite.path }} ｜ 相似度：{{ srcDialog.cite.score }}</p>
        <div class="readonly-grey"><el-input type="textarea" :rows="6" :model-value="srcDialog.cite.content" readonly></el-input></div>
      </template>
    </el-dialog>
  </div>`,
};

    </el-dialog>

    <el-dialog v-model="rebuildConfirm" title="全库重建索引" :close-on-click-modal="false" width="440px">
      <el-alert type="error" :closable="false" show-icon
        title="将对全部文档重建向量索引。重建期间问答不中断，但新上传文档需等待重建完成。确认执行？"></el-alert>
      <template #footer>
        <el-button @click="rebuildConfirm = false">取消</el-button>
        <el-button type="danger" :loading="rebuilding" @click="doRebuildAll">确认重建</el-button>
      </template>
    </el-dialog>
  </div>`,
  methods: {
    onFile(file) {
      const name = file.name.toLowerCase();
      if (name.endsWith('.doc')) { this.upload.fileErr = '.doc 不支持，请另存为 docx 后上传'; this.upload.file = null; return; }
      if (!name.endsWith('.pdf') && !name.endsWith('.docx')) { this.upload.fileErr = '仅支持 pdf / docx 文件'; this.upload.file = null; return; }
      if (file.size > 50 * 1024 * 1024) { this.upload.fileErr = '文件超过 50MB'; this.upload.file = null; return; }
      this.upload.fileErr = ''; this.upload.file = file;
      if (!this.upload.form.title) this.upload.form.title = file.name.replace(/\.[^.]+$/, '');
    },
    openUpload() { this.upload.show = true; },
    resetUpload() { this.upload = { show: false, step: 1, file: null, fileErr: '', form: { title: '', dept: '', owner: '', eff: '', exp: '' }, comply: false, formErr: '' }; },
    submitUpload() {
      const f = this.upload.form;
      if (!f.title || !f.dept || !f.owner || !f.eff) { this.upload.formErr = '标题、部门、责任人、生效日期均为必填元数据'; return; }
      if (!this.upload.comply) { this.upload.formErr = '必须勾选合规确认后才能入库'; return; }
      const dept = f.dept === 'all' ? 'all' : f.dept;
      const doc = { id: nextId(), title: f.title, dept, ver: 1, status: 'pending', owner: f.owner, eff: f.eff, exp: f.exp || null, degraded: false, active: true };
      S.documents.unshift(doc);
      this.page = 1;
      addAudit('document.upload', '文档 #' + doc.id, f.title + ' v1');
      this.upload.show = false;
      ElementPlus.ElMessage.success('已加入解析队列');
      setTimeout(() => { doc.status = 'parsing'; }, 1200);
      const t = setInterval(() => {
        doc.progress = (doc.progress || 0) + 15;
        if (doc.progress >= 100) { clearInterval(t); doc.status = 'ready'; ElementPlus.ElMessage.success(doc.title + ' 解析完成'); }
      }, 900);
    },
    retry(row) { row.status = 'parsing'; row.progress = 10; addAudit('document.retry', '文档 #' + row.id, row.title);
      const t = setInterval(() => { row.progress += 20; if (row.progress >= 100) { clearInterval(t); row.status = 'ready'; row.err = undefined; } }, 700); },
    del(row) {
      if (row.title.includes('退货政策')) { ElementPlus.ElMessage.warning('该文档被评测题引用，请先停用相关评测题再删除'); return; }
      S.documents = S.documents.filter(d => d.id !== row.id); addAudit('document.delete', '文档 #' + row.id, row.title); ElementPlus.ElMessage.success('已删除');
    },
    rebuild(row) { addAudit('document.rebuild', '文档 #' + row.id, row.title); ElementPlus.ElMessage.success('重建任务已提交，服务不中断（演示）'); },
    rebuildAll() { this.rebuilding = true; this.rebuildConfirm = false; setTimeout(() => { this.rebuilding = false; addAudit('index.rebuild_all', '全库', '7 文档'); ElementPlus.ElMessage.success('全库重建任务已提交（演示）'); }, 1200); },
  },
};

};

          qa: item.cites.find(c => c.type === 'qa') ? { id: 1024, score: item.cites.find(c => c.type === 'qa').score, q: item.cites.find(c => c.type === 'qa').title } : null,
          chunks: item.cites.filter(c => c.type === 'doc').map(c => ({ score: c.score, title: c.title, path: c.path, snippet: c.content })),
          refuse: false,
        } : {
          qa: null,
          chunks: this.scope === 'alldepts' ? [] : [],
          refuse: true,
        };
        if (this.result.chunks.length === 0 && !this.result.qa) this.result.refuse = true;
        this.testing = false;
      }, 700);
    },
  },
};

        <h4 style="margin:0 0 10px">逐题人工复核（判定写入 eval_runs.detail）</h4>
        <div v-for="q in S.evalQuestions" :key="q.id" style="border:1px solid #ebeef5;border-radius:6px;padding:10px;margin-bottom:8px">
          <div style="font-size:13px"><el-tag size="small" style="margin-right:6px">{{ S.deptName[q.dept] }}</el-tag>{{ q.q }}</div>
          <div style="font-size:12px;color:#909399;margin:6px 0">期望：{{ q.expected }} ｜ 出处：{{ q.ref }}</div>
          <div class="readonly-grey" style="margin:6px 0"><el-input type="textarea" :rows="2" :model-value="q.ans || '（待跑分生成）'" readonly></el-input></div>
          <div style="font-size:12px;color:#909399;margin:6px 0">命中引用：{{ q.cite || '-' }}</div>
          <el-radio-group v-model="judge[q.id]" size="small">
            <el-radio-button value="correct">正确</el-radio-button>
            <el-radio-button value="wrong">错误</el-radio-button>
            <el-radio-button value="refuse_ok">拒答正确</el-radio-button>
          </el-radio-group>
        </div>
      </template>
    </el-drawer>
  </div>`,
  methods: {
    doRun() {
      this.run.running = true; this.run.show = false;
      setTimeout(() => {
        const acc = 0.78 + Math.random() * 0.12;
        S.evalRuns.unshift({ id: nextId(), name: '演示回归 ' + nowStr(), model: 'glm-4-air', prompt: 'v1.2',
          total: S.evalQuestions.length * 10, correct: Math.round(S.evalQuestions.length * 10 * acc), acc,
          deptAcc: { service: Math.min(0.95, acc + 0.02), hr: Math.max(0.7, acc - 0.02) }, time: nowStr() + ':00' });
        addAudit('eval.run', '评测', '演示回归，准确率 ' + (acc * 100).toFixed(1) + '%');
        this.run.running = false;
        ElementPlus.ElMessage.success('跑分完成，准确率 ' + (acc * 100).toFixed(1) + '%');
      }, 2000);
    },
  },
};

/* ---------- 审计日志 ---------- */
const AuditView = {
  data() { return { S, page: 1, pageSize: 20, kw: '' }; },
  computed: {
    filtered() {
      const k = this.kw.trim();
      return S.auditLogs.filter(a => !k || a.actor.includes(k) || a.action.includes(k) || a.obj.includes(k) || a.detail.includes(k));
    },
    paged() { const s = (this.page - 1) * this.pageSize; return this.filtered.slice(s, s + this.pageSize); },
  },
  template: `
  <div>
    <div class="filter-row">
      <el-input v-model="kw" placeholder="操作人 / 动作 / 对象关键字" style="width:240px" clearable @keyup.enter="page = 1"></el-input>
      <el-button type="primary" @click="page = 1">查询</el-button><el-button @click="kw = ''; page = 1">重置</el-button>
      <span style="flex:1"></span>
      <el-button @click="ElementPlus.ElMessage.success('CSV 导出（演示）')">导出 CSV</el-button>
    </div>
    <el-table :data="paged" border stripe>
      <el-table-column prop="time" label="时间" width="140"></el-table-column>
      <el-table-column prop="actor" label="操作人" width="120"></el-table-column>
      <el-table-column prop="action" label="动作" width="170"><template #default="{ row }"><code>{{ row.action }}</code></template></el-table-column>
      <el-table-column prop="obj" label="对象" width="160"></el-table-column>
      <el-table-column prop="detail" label="详情" min-width="240"></el-table-column>
    </el-table>
    <div class="pager-row">
      <el-pagination v-model:current-page="page" v-model:page-size="pageSize" :page-sizes="[10,20,50,100]"
        layout="total, sizes, prev, pager, next" :total="filtered.length"></el-pagination>
    </div>
  </div>`,
};

/* ---------- P10 运营概览 ---------- */
const OverviewView = {
  data() { return { S }; },
  computed: {
    tokenBars() {
      return [ { name: '客服（service）', v: 1200000 }, { name: '人力（hr）', v: 820000 }, { name: '全员（all）', v: 150000 } ];
    },
    maxToken() { return Math.max(...this.tokenBars.map(t => t.v)); },
  },
  template: `
  <div>
    <div class="stat-cards">
      <div class="stat-card"><div class="num">128</div><div class="lbl">今日提问</div></div>
      <div class="stat-card"><div class="num">87%</div><div class="lbl">命中率（非拒答）</div></div>
      <div class="stat-card"><div class="num">9%</div><div class="lbl">拒答率</div></div>
      <div class="stat-card"><div class="num" style="color:#f56c6c">4%</div><div class="lbl">点踩率</div></div>
    </div>
    <div class="panel">
      <h4>token 消耗（按部门 · 数据源 按日聚合，≤5 分钟延迟）</h4>
      <div class="bar-row" v-for="t in tokenBars" :key="t.name">
        <span class="bar-name">{{ t.name }}</span>
        <div class="bar-track"><div class="bar-fill" :style="{ width: (t.v / maxToken * 100) + '%' }"></div></div>
        <span style="width:90px;text-align:right;color:#606266">{{ (t.v / 10000).toFixed(1) }} 万</span>
      </div>
    </div>
    <div class="panel">
      <h4>最近 badcase（点击去处理）</h4>
      <el-table :data="S.badcases.slice(0, 5)" size="small" @row-click="() => $root.page = 'badcase'" style="cursor:pointer">
        <el-table-column prop="time" label="时间" width="120"></el-table-column>
        <el-table-column label="部门" width="90"><template #default="{ row }">{{ S.deptName[row.dept] }}</template></el-table-column>
        <el-table-column prop="q" label="问题" min-width="200" show-overflow-tooltip></el-table-column>
        <el-table-column prop="cat" label="分类" width="110"></el-table-column>
        <el-table-column prop="status" label="状态" width="100"></el-table-column>
      </el-table>
    </div>
  </div>`,
};

/* ---------- 装配 ---------- */
const app = createApp(App);
app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
for (const [name, comp] of Object.entries(ElementPlusIconsVue)) app.component(name, comp);
app.component('login-view', LoginView);
app.component('chat-view', ChatView);
app.component('doc-view', DocView);
app.component('qa-view', QaView);
app.component('retrieval-view', RetrievalView);
app.component('users-view', UsersView);
app.component('messages-view', MessagesView);
app.component('badcase-view', BadcaseView);
app.component('eval-view', EvalView);
app.component('audit-view', AuditView);
app.component('overview-view', OverviewView);
app.mount('#app');
</script>
</body>
</html>
