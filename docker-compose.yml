services:
  pg:
    image: pgvector/pgvector:pg15
    container_name: ragdemo-pg
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  pg-test:
    image: pgvector/pgvector:pg15
    container_name: ragdemo-pg-test
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag_test

  # TEI embedding（BGE-M3，dim=1024）。宿主 8081 被本机其他项目占用，dev 映射 8091；
  # 生产 VM 无冲突时按 standards §12.2 映射回 8081。模型经 make-dev-models 预热到
  # ./data/tei-models（TEI 自带下载器与 hf-mirror 不兼容：不回 content-range 头），
  # --model-id 指本地路径完全绕开在线下载；data/ 已被 gitignore。
  tei-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.2
    container_name: ragdemo-tei-embed
    command: ["--model-id", "/data/bge-m3", "--pooling", "cls", "--max-batch-tokens", "2048"]
    ports:
      - "8091:80"
    volumes:
      - ./data/tei-models:/data
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 10m

  # TEI rerank（bge-reranker-v2-m3，原始 logit 由应用侧 sigmoid 归一化，§4.4 分数口径）
  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.2
    container_name: ragdemo-tei-rerank
    command: ["--model-id", "/data/bge-reranker-v2-m3", "--max-batch-tokens", "2048"]
    ports:
      - "8082:80"
    volumes:
      - ./data/tei-models:/data
    mem_limit: 4.5g  # candle 加载+warmup 峰值高（无 onnx 导出，唯一后端），需 4.5g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 10m

  # MinerU 解析服务（pipeline 后端，CPU）。本机 Docker 仅 8G 内存，与双 TEI 无法常驻并存，
  # 归入 parser profile 按需启停：跑解析/黄金回归时 docker compose --profile parser up mineru。
  # 生产 4C16G VM 上常驻（§12.5 资源位 4C6G）。模型经 ModelScope 国内源预热进卷。
  mineru:
    build:
      context: .
      dockerfile: docker/mineru-cpu.Dockerfile
    container_name: ragdemo-mineru
    profiles: ["parser"]
    ports:
      - "8090:8000"
    environment:
      MINERU_MODEL_SOURCE: modelscope
    volumes:
      - mineru-models:/root/.cache
    mem_limit: 5g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 15m

  # 应用（§12.2 容器清单核心）：uvicorn + 前端 dist 单容器，启动即迁移（entrypoint）。
  # 连接串覆盖为 compose 内网主机名；其余配置继承 .env（密钥不落 compose，§12.7）。
  # TEST_MODE=true 供 CI E2E L1 确定性层（生产必须 false，§2.6）。
  # TEI 不设硬依赖：无 TEI 时服务仍可起（登录/文档管理可用，问答在装配层报上游错误），
  # 避免本机双 TEI 十分钟级加载阻塞全栈启动。
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragdemo-app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@pg:5432/rag
      STATIC_DIR: /srv/ragdemo/static
      TEST_MODE: ${TEST_MODE:-false}
    env_file:
      - .env
    volumes:
      - uploads:/srv/ragdemo/data
    depends_on:
      pg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  pgdata:
  mineru-models:
  uploads:
