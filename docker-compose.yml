services:
  pg:
    image: pgvector/pgvector:pg15
    container_name: ragdemo-pg
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  pg-test:
    image: pgvector/pgvector:pg15
    container_name: ragdemo-pg-test
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag_test

volumes:
  pgdata:
