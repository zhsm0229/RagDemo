# 企业智能工作台 CI 最小流水线（standards §20.2 五阶段：lint / type / test / security / build）。
#
# 平台说明：公司 CI 平台未定，本文件以 GitHub Actions 为主交付；
# 公司若用 GitLab，按同结构转 .gitlab-ci.yml——stages 同为
# lint/type/test/security/build，各 job 的 image/script 一一对应本文件步骤，
# test 阶段 services 用 pgvector/pgvector:pg15 同镜像同端口（5434），
# gitleaks 换 gitleaks/gitlab-ci 模板并沿用仓库根 .gitleaks.toml 排除规则。
#
# 触发：push 到 main + 所有 pull_request（§20.2-2：MR 触发、失败即停；
# 例外：type 阶段起步期 continue-on-error，见该 job 注释，W2 收紧）。
#
# 依赖安装（W2 收口）：凡装项目依赖的 job 一律 setup-uv + `uv sync --locked --extra dev`
# （uv.lock 入库为唯一依赖事实源；--locked 在 lock 缺失或与 pyproject 漂移时显式报错，
# 不静默回退 pip）。ruff/mypy/pip-audit 等 dev extras 外的工具按 job 注释叠加安装，
# 不改锁定依赖。各步骤统一用 `uv run --no-sync <cmd>` 在 .venv 内执行。
name: ci

on:
  push:
    branches: [main]
  pull_request:

# 最小权限（§6 安全规范）：GITHUB_TOKEN 全局只读 contents:read；gitleaks-action
# 仅需读仓库与扫描，不开 issue-comment 等额外权限，后续确需再按 job 单独放开。
permissions:
  contents: read

jobs:
  # ---------- ① lint：ruff（后端静态检查，本地等价 `make lint`） ----------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0（SHA pin，防 tag 漂移）
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0（SHA pin）
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0（SHA pin）
        with:
          enable-cache: true # uv 缓存：与 test/security job 一致（W3 Task 1 收紧）
      - name: Locked dependency install (uv)
        run: uv sync --locked --extra dev
      - name: Ruff check
        run: uv run --no-sync ruff check app tests # 版本由 uv.lock 锁定（0.16.9），与本地 .venv 同源
      - name: Ruff format check (standards §20.2)
        run: uv run --no-sync ruff format --check app tests

  # ---------- ② type：mypy 宽松模式，限 rag/services/core ----------
  # 起步期 continue-on-error：mypy 首跑大概率报存量类型问题，§20.2 未强制 type
  # 为门禁红；记录为 W2 收紧项（清零存量后摘掉此开关）。
  type:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0（SHA pin，防 tag 漂移）
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0（SHA pin）
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0（SHA pin）
        with:
          enable-cache: true # uv 缓存：与 test/security job 一致（W3 Task 1 收紧）
      - name: Locked dependency install + mypy
        run: |
          uv sync --locked --extra dev
          # mypy 不在 dev extras（起步期宽松门未定版），叠加安装不动锁定依赖；
          # 钉版（当前 2.3.1，W3 Task 1）：类型检查结果不随上游发版漂移。
          uv pip install mypy==2.3.1
      - name: Mypy (loose)
        run: uv run --no-sync mypy --ignore-missing-imports app/rag app/services app/core

  # ---------- ③ test：pytest（P0 冒烟 = tests/api + tests/integration 随全量跑） ----------
  # compose 等价：起 pgvector/pgvector:pg15（pg-test 档，5434，healthcheck 门禁）；
  # conftest 硬编码 TEST_DB_URL=localhost:5434/rag_test，端口映射必须 5434:5432。
  # CI 内解析用 Parser stub + pypdf/docx 样例；MinerU/TEI 全链路冒烟属部署机档
  # （§15.9 里程碑收口执行），不在 CI。
  test:
    runs-on: ubuntu-latest
    services:
      pg-test:
        image: pgvector/pgvector:pg15
        ports:
          - "5434:5432"
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_test
        options: >-
          --health-cmd "pg_isready -U rag -d rag_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5434/rag_test
      # CI 占位 JWT_SECRET（仅测试用，≥32 字符；env 优先级高于 .env 文件值）
      JWT_SECRET: ci-placeholder-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0（SHA pin，防 tag 漂移）
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0（SHA pin）
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0（SHA pin）
        with:
          enable-cache: true # uv 缓存（原 setup-python 的 cache: pip 随之弃用）
      - name: Locked dependency install (uv)
        # uv.lock 已入库（user-commits-2.sh 兜底项，chore: commit uv lockfile 已先行提交）；
        # --locked 下 lock 缺失/漂移即红，明确报错，不静默回退 pip（W2 收口约定）。
        run: uv sync --locked --extra dev
      - name: Prepare .env from example
        run: cp .env.example .env # 真实值被上方 env 覆盖；.env 本身不入库
      - name: Alembic upgrade head
        run: uv run --no-sync alembic upgrade head
      - name: Pytest with coverage (rag/services >= 70%)
        run: >-
          uv run --no-sync pytest --cov=app/rag --cov=app/services --cov-fail-under=70
          --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2（SHA pin）
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  # ---------- ④ security：pip-audit 依赖漏洞 + gitleaks 密钥泄漏 ----------
  # gitleaks 用仓库根 .gitleaks.toml：在默认规则之上排除 docs/specs/ui-mockups/html/lib/
  # 下 5 个 vendored 官方 Vue/Element Plus 分发件（带 sha256 记录，Mimosa 已裁决误报）。
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0（SHA pin，防 tag 漂移）
        with:
          fetch-depth: 0 # gitleaks 全历史扫描
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0（SHA pin）
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0（SHA pin）
        with:
          enable-cache: true
      - name: Locked dependency install + audit tooling
        run: |
          uv sync --locked --extra dev
          # pip-audit 不在 dev extras：叠加安装审计工具，项目依赖仍由 uv.lock 锁定；
          # uv venv 默认不含 pip 而 pip-audit 的环境审计依赖 pip，一并补装。
          # pip-audit 钉版（当前 2.10.1，W3 Task 1）：漏洞库解析行为不随上游发版漂移。
          uv pip install pip pip-audit==2.10.1
      - name: pip-audit
        run: uv run --no-sync pip-audit --skip-editable # 审计全部已装依赖，跳过本仓库 editable 包自身
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9（v2 分支头 commit，SHA pin）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- ⑤ build：全部镜像 docker build 成功（tag = 分支名 + 短 SHA） ----------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0（SHA pin，防 tag 漂移）
      - name: Docker build
        run: docker build -f Dockerfile -t "ragdemo:${GITHUB_REF_NAME}-${GITHUB_SHA::7}" .

  # ---------- ⑥-⑨ 前端流水线（W4 Task 6，working-directory=frontend） ----------
  # 四 job 与后端五阶段同规：lint（eslint+prettier）/ type（vue-tsc）/ test（vitest）/ build（vite build+产物断言）。
  # 依赖事实源为 frontend/package-lock.json（依赖全部钉精确版本），CI 一律 npm ci 不用 install；
  # setup-node 用 actions/setup-node（astral-sh/setup-node 不存在），node 20 与本地验证版本一致口径。
  # 四 job 互不依赖可并行（backend 各阶段间亦无 fe 依赖）。
  fe-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0（与后端 job 同 SHA pin）
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0（SHA pin，防 tag 漂移）
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: ESLint (禁 any / 禁 console)
        run: npm run lint:eslint
      - name: Prettier check
        run: npm run lint:prettier

  fe-type:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0（SHA pin）
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0（SHA pin）
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: vue-tsc
        run: npm run type

  fe-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0（SHA pin）
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0（SHA pin）
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Vitest
        run: npm run test

  fe-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0（SHA pin）
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0（SHA pin）
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Vite build (vue-tsc 先行)
        run: npm run build
      - name: Assert dist exists
        run: test -d dist
