# 企业智能工作台 CI 最小流水线（standards §20.2 五阶段：lint / type / test / security / build）。
#
# 平台说明：公司 CI 平台未定，本文件以 GitHub Actions 为主交付；
# 公司若用 GitLab，按同结构转 .gitlab-ci.yml——stages 同为
# lint/type/test/security/build，各 job 的 image/script 一一对应本文件步骤，
# test 阶段 services 用 pgvector/pgvector:pg15 同镜像同端口（5434），
# gitleaks 换 gitleaks/gitlab-ci 模板并沿用仓库根 .gitleaks.toml 排除规则。
#
# 触发：push 到 main + 所有 pull_request（§20.2-2：MR 触发、失败即停；
# 例外：type 阶段起步期 continue-on-error，见该 job 注释，W2 收紧）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

# 最小权限（§6 安全规范）：GITHUB_TOKEN 全局只读 contents:read；gitleaks-action
# 仅需读仓库与扫描，不开 issue-comment 等额外权限，后续确需再按 job 单独放开。
permissions:
  contents: read

jobs:
  # ---------- ① lint：ruff（后端静态检查，本地等价 `make lint`） ----------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0（SHA pin，防 tag 漂移）
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0（SHA pin）
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.9 # 与本地 .venv 同版本，避免规则漂移
      - name: Ruff check
        run: ruff check app tests

  # ---------- ② type：mypy 宽松模式，限 rag/services/core ----------
  # 起步期 continue-on-error：mypy 首跑大概率报存量类型问题，§20.2 未强制 type
  # 为门禁红；记录为 W2 收紧项（清零存量后摘掉此开关）。
  type:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0（SHA pin，防 tag 漂移）
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0（SHA pin）
        with:
          python-version: "3.12"
      - name: Install project + mypy
        run: pip install -e ".[dev]" mypy
      - name: Mypy (loose)
        run: mypy --ignore-missing-imports app/rag app/services app/core

  # ---------- ③ test：pytest（P0 冒烟 = tests/api + tests/integration 随全量跑） ----------
  # compose 等价：起 pgvector/pgvector:pg15（pg-test 档，5434，healthcheck 门禁）；
  # conftest 硬编码 TEST_DB_URL=localhost:5434/rag_test，端口映射必须 5434:5432。
  # CI 内解析用 Parser stub + pypdf/docx 样例；MinerU/TEI 全链路冒烟属部署机档
  # （§15.9 里程碑收口执行），不在 CI。
  test:
    runs-on: ubuntu-latest
    services:
      pg-test:
        image: pgvector/pgvector:pg15
        ports:
          - "5434:5432"
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_test
        options: >-
          --health-cmd "pg_isready -U rag -d rag_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5434/rag_test
      # CI 占位 JWT_SECRET（仅测试用，≥32 字符；env 优先级高于 .env 文件值）
      JWT_SECRET: ci-placeholder-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0（SHA pin，防 tag 漂移）
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0（SHA pin）
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project (dev extras)
        run: pip install -e ".[dev]"
      - name: Prepare .env from example
        run: cp .env.example .env # 真实值被上方 env 覆盖；.env 本身不入库
      - name: Alembic upgrade head
        run: alembic upgrade head
      - name: Pytest with coverage (rag/services >= 70%)
        run: >-
          pytest --cov=app/rag --cov=app/services --cov-fail-under=70
          --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2（SHA pin）
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  # ---------- ④ security：pip-audit 依赖漏洞 + gitleaks 密钥泄漏 ----------
  # gitleaks 用仓库根 .gitleaks.toml：在默认规则之上排除 docs/specs/ui-mockups/html/lib/
  # 下 5 个 vendored 官方 Vue/Element Plus 分发件（带 sha256 记录，Mimosa 已裁决误报）。
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0（SHA pin，防 tag 漂移）
        with:
          fetch-depth: 0 # gitleaks 全历史扫描
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0（SHA pin）
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project (dev extras)
        run: pip install -e ".[dev]"
      - name: pip-audit
        run: pip-audit --skip-editable # 审计全部已装依赖，跳过本仓库 editable 包自身
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9（v2 分支头 commit，SHA pin）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- ⑤ build：全部镜像 docker build 成功（tag = 分支名 + 短 SHA） ----------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0（SHA pin，防 tag 漂移）
      - name: Docker build
        run: docker build -f Dockerfile -t "ragdemo:${GITHUB_REF_NAME}-${GITHUB_SHA::7}" .
