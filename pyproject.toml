[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragdemo"
version = "0.1.0"
description = "企业智能工作台（RAG 知识问答工作台）"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "bcrypt>=5.0",
    "pyjwt",
    "python-multipart",
    "python-docx",
    "pypdf",
    "openpyxl==3.1.5",
    "python-pptx",
    "pydantic-settings",
    "apscheduler",
    "httpx",
    # ---- Agent 演进（F-211/212，工单 #04，详见 docs/specs/agent-evolution.md §四/§六）----
    "deepagents>=0.7.22",  # deep agent harness（LangGraph 基座）：模板生成首任务的四件套
    "langgraph>=1.2.14",  # deepagents 传递依赖：agent 循环与状态机（显式声明便于锁定审计）
    "langchain-core>=1.6.7",  # app/core/agent_model.py 直接导入：BaseChatModel 最小面适配
    "ag-ui-protocol>=1.0.0",  # /api/agent/runs SSE 的 AG-UI 事件类型（F-212，不另造方言）
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# docs/ 下设计文档含大量 .md 内嵌示意代码块，不受代码格式门约束（ruff 0.16 会格式化 md 代码块）
extend-exclude = ["docs"]

[tool.coverage.run]
include = ["app/rag/*", "app/services/*"]

[tool.coverage.report]
fail_under = 70

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
]
